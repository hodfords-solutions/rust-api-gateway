[package]
name = "api-gateway"
description = "An API gateway for axum and Tokio that builds its routes from upstream OpenAPI documents, with middleware, Redis-backed rate limiting, WebSocket proxying and an optional MCP server. A Rust port of @hodfords/nestjs-api-gateway."
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish = true
repository = "https://github.com/hodfords-solutions/rust-api-gateway"
readme = "../../README.md"
keywords = ["api-gateway", "gateway", "proxy", "openapi", "rate-limit"]
categories = ["web-programming::http-server", "network-programming"]
# Tests, benches and their golden data stay in the repository. Several of them load
# fixtures from outside this directory (conformance/, benches/), so they cannot build
# from the published package, and the test data includes self-signed keys.
exclude = ["/tests", "/benches", "/src/**/testdata"]

[package.metadata.docs.rs]
# Document the `mcp` and `otel` modules too.
all-features = true

[features]
# Parity Checklist area 08: the MCP server (`mcp` module).
mcp = ["dep:rmcp"]
# Parity Checklist area 09: OpenTelemetry tracing (`otel` module).
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "reqwest/blocking"]

[dependencies]
arc-swap = "1.9.5"
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "original-uri", "query", "tokio"] }
bytes = "1.12.2"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
httparse = "1.10.1"
httpdate = "1.0.3"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
indexmap = "2.14.2"
opentelemetry = { version = "0.33.1", optional = true, default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", optional = true, default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33.1", optional = true, default-features = false, features = ["trace"] }
redis = { version = "1.8.2", default-features = false, features = ["aio", "tokio-comp", "script"] }
regex = "1.13.2"
rmcp = { version = "3.11.0", optional = true, default-features = false, features = ["server", "transport-streamable-http-server"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1_smol = "1.0.1"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-service = "0.3.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
url = "2.5.8"
webpki-roots = "1"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "testing"] }
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tower-http = { version = "0.6.11", default-features = false, features = ["cors", "set-header"] }

# Micro-benchmarks of the hot paths; see benches/README.md at the repository root.
# The library's own libtest bench harness is off so criterion's arguments reach criterion.
[lib]
bench = false

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
