[package]
name = "rust-gateway"
description = "A Rust port of the @hodfords/nestjs-api-gateway library."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arc-swap = "1.9.5"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
