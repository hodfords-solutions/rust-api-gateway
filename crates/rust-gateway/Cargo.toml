[package]
name = "rust-gateway"
description = "A Rust port of the @hodfords/nestjs-api-gateway library."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# rate_limit
http = "1.5.0"
redis = { version = "1.8.2", default-features = false, features = ["aio", "tokio-comp", "script"] }
regex = "1.13.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
webpki-roots = "1"

[dev-dependencies]
# rate_limit
tokio = { version = "1.54.1", features = ["full"] }

[lints]
workspace = true
