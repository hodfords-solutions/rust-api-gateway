[package]
name = "rust-gateway-server"
description = "Example binary embedding rust-gateway; also the Rust target of the Conformance Tests."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
http = "1.5.0"
rust-gateway = { path = "../rust-gateway" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[lints]
workspace = true
