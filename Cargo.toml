[workspace]
resolver = "3"
members = [
    "crates/rust-gateway",
    "crates/rust-gateway-server",
    "conformance/harness",
]
exclude = ["spikes", "fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
# `cargo fuzz` builds with `--cfg fuzzing`, which exposes `api_gateway::fuzzing` (fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
