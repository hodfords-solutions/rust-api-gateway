[package]
name = "conformance"
description = "Conformance harness for rust-gateway: mock upstream, raw HTTP client and scenario runner."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The scenarios need Node, the built reference app and Redis, so they are only compiled
# and run when this feature is enabled. See docs/development.md.
conformance = []

[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
httparse = "1.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"

[[bin]]
name = "mock-upstream"
path = "src/bin/mock-upstream.rs"

[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
required-features = ["conformance"]

[lints]
workspace = true
