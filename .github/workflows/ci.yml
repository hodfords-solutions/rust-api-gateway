name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Redis
        run: docker compose -f conformance/docker-compose.yml up -d --wait
      # The Redis-backed integration tests skip without Redis; here they must run.
      - run: cargo test --workspace
        env:
          RATE_LIMIT_REQUIRE_REDIS: "1"

  conformance:
    name: Conformance (reference and rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: conformance/reference/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: conformance/reference/pnpm-lock.yaml
      - name: Start Redis
        run: docker compose -f conformance/docker-compose.yml up -d --wait
      - name: Build the reference app
        working-directory: conformance/reference
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build rust-gateway-server
        run: cargo build -p rust-gateway-server
      # `both` runs every scenario against the reference, the scenarios whose IDs are in
      # conformance/rust-implemented.txt against rust-gateway-server too, and compares them.
      - name: Run the Conformance Tests against both targets
        env:
          CONFORMANCE_TARGET: both
        run: cargo test -p conformance --features conformance
      - name: Upload gateway logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-logs
          path: target/conformance/
